[package]
name = "bbvoxi"
# Cargo 要求 version 为 SemVer 三段式（1.4.1）；界面上以 v1.4.1 原样显示，
# 主人靠它分辨"我测的到底是不是新版"，**自动更新也是拿它跟 GitHub 上的最新版本比**。
# 发新版时务必改这里（只改发布产物名不行），详见 README「发布新版本」一节。
version = "1.4.1"
edition = "2021"
description = "BBVoxi - Windows 语音输入法：按住快捷键说话，松开即自动输入到光标处"
rust-version = "1.80"

[dependencies]
eframe = { version = "0.35.0", default-features = false, features = [
    "glow",
    "default_fonts",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
tray-icon = "0.24.2"
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = [
    "connect",
    "rustls-tls-webpki-roots",
] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
# rustls 必须显式启用一个加密后端，否则首次 WSS 连接会 panic
# （release 是 unwind，不会被 abort 掉，但后台线程仍会带着这次会话一起结束）
# 不要加 `logging`：它只是把 rustls 接到 `log` crate 上，而本程序没有装任何
# logger —— 开了也只是多编一份用不上的代码。
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "std",
    "tls12",
] }
cpal = "0.17"
flate2 = "1"
hmac = "0.12"
sha1 = "0.10"
base64 = "0.22"
percent-encoding = "2"
uuid = { version = "1", features = ["v4"] }
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_Registry",
    "Win32_System_SystemInformation", # GetLocalTime：日志本地时间戳
    "Win32_System_DataExchange",      # 剪贴板读写（兜底粘贴用）
    "Win32_System_Memory",            # GlobalAlloc：剪贴板内存必须内核托管
    "Win32_System_Ole",               # CF_UNICODETEXT 常量
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",                 # ShellExecuteW：用系统浏览器打开项目地址
    "Win32_UI_WindowsAndMessaging",
] }
# 自动更新用：查 GitHub 最新发布 + 下载 exe。
# 版本**故意钉在 ~3.2**：ureq 3.3 起要求 rustc ≥1.85，而本项目向主人承诺的是
# 「Rust 1.80+ 就能编」（见 README）。放开成 3.x 会让那条承诺悄悄失效 ——
# 编译机上工具链新、看不出来，等哪天用老工具链编就炸。
#
# `win-system-proxy` **必须有**：它让 ureq 读 Windows「Internet 选项 → 代理服务器」
# 那个设置。主人这台机器上实测差别是**10 倍速度**（直连 68KB/s vs 走代理 663KB/s），
# 不读代理时 8MB 的更新包 600 秒都下不完 —— 更新功能等于废的。
ureq = { version = "~3.2", default-features = false, features = [
    "rustls",
    "win-system-proxy",
] }
# 校验下载下来的 exe 的 SHA-256（GitHub 每个发布资产都公布了这个指纹）
sha2 = "0.10.9"
# 安全替换**正在运行的自己**：Windows 不许覆盖运行中的 exe，这个库按标准姿势做
# 「旧的改名让位 → 新的就位 → 下次启动清掉旧文件」，比自己手写可靠
self-replace = "1.5.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
# 不用 panic=abort：常驻程序里一次 panic 就静默消失是最糟的失败方式，
# 改成 unwind 后后台线程的 panic 不会带走整个程序，配合 panic hook 还会记进日志。
panic = "unwind"
strip = true
